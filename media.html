<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Média</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <div class="container">

        <h1>Calculadora de Média</h1>
        <p class="subtitulo">Sistema de Notas de Aluno</p>

        <div id="formulario">

            <label for="nome">Nome do Aluno:</label>

            <input 
                type="text" 
                id="nome" 
                placeholder="Digite o nome do aluno" 
                required
            >

            <label for="disciplina">Disciplina:</label>

            <select id="disciplina" required>
                <option value="">Selecione uma disciplina</option>
                <option value="FDD">Fundamentos do Design Digital</option>
                <option value="FTDI">Fotografia Digital</option>
                <option value="PRAAI">Projetos de Áudio e Vídeo I</option>
            </select>

        </div>

        <br>
        <br>

        <div class="notas">

            <div>
                <label>1º Bimestre</label>

                <input 
                    type="number" 
                    id="nota1"
                    placeholder="Digite a nota" 
                    min="0"
                    max="10"
                    step="0.1"
                    required
                >
            </div>

            <div>
                <label>2º Bimestre</label>

                <input 
                    type="number" 
                    id="nota2"
                    placeholder="Digite a nota" 
                    min="0"
                    max="10"
                    step="0.1"
                    required
                >
            </div>

            <div>
                <label>3º Bimestre</label>

                <input 
                    type="number" 
                    id="nota3"
                    placeholder="Digite a nota" 
                    min="0"
                    max="10"
                    step="0.1"
                    required
                >
            </div>

            <div>
                <label>4º Bimestre</label>

                <input 
                    type="number" 
                    id="nota4"
                    placeholder="Digite a nota" 
                    min="0"
                    max="10"
                    step="0.1"
                    required
                >
            </div>

        </div>

        <div>

            <button id="calcular" onclick="calcularMedia()">
                Calcular Média
            </button>

            <button id="novocalculo" onclick="calcularNovo()">
                Calcular Novamente
            </button>

            <a href="" id="link">Calculadora Comum</a>

        </div>

        <div id="resultado" class="resultado">
            <p>Preencha os dados acima e clique em calcular média</p>
        </div>

      
    </div>

    <script src="./calcular-media.js"></script>

</body>

</html>
